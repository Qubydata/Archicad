[project]
name = "tevavid-tools"
version = "0.1.3"
description = "Tevavid Tools for Archicad: an AI assistant (Claude MCP), sun and daylight analysis, and more"
readme = "README.md"
keywords = ["archicad", "mcp", "bim", "claude", "tapir"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3,<3",
    "ezdxf>=1.3",
    "httpx>=0.27",
    "mapbox-earcut>=1.0",
    "mcp>=2.3,<3",
    "numpy>=1.26",
    "pillow>=10.1",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
tevavid-mcp = "archicad_mcp.server:main"
tevavid-panel = "archicad_mcp.chat.app:main"

[project.optional-dependencies]
installer = [
    "pywebview>=5.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.uv.build-backend]
module-name = "archicad_mcp"
