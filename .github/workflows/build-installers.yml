name: Build installers

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of the version in the code (makes its v tag)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra installer
      - run: uv run pytest -q
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release.py notes "$GITHUB_REF_NAME"

  # The Tevavid Archicad add-on for each Archicad version; setup carries them.
  addon:
    uses: ./.github/workflows/build-addon.yml

  build:
    needs: [test, addon]
    # Also when an add-on build failed: setup then installs Tapir for the versions without a Tevavid add-on.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TevavidToolsSetup-Windows
            addons: TevavidAddOn-*-Win
          - os: macos-latest
            artifact: TevavidToolsSetup-macOS
            addons: TevavidAddOn-*-Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra installer
      - name: Get the Tevavid add-ons
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ${{ matrix.addons }}
          path: build/addons
          merge-multiple: true
      - name: Build
        run: uv run python packaging/build.py

      - name: Install, check and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The wizard window itself: opens, fills in from Python, closes.
          $env:PYWEBVIEW_LOG = "debug"
          $window = Start-Process dist/release/TevavidToolsSetup.exe -ArgumentList '--selftest' -PassThru
          $finished = $window.WaitForExit(180000)
          Get-Content "$env:USERPROFILE\.tevavid-tools\setup.log" -ErrorAction SilentlyContinue
          if (-not $finished) { $window.Kill(); throw "setup window self-test hung" }
          if ($window.ExitCode -ne 0) {
            # A crash inside .NET (0xE0434352) leaves its error in the Application event log.
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
              Select-Object -First 4 | Format-List TimeCreated, ProviderName, Message
            throw "setup window self-test failed with $($window.ExitCode)"
          }
          $setup = Start-Process dist/release/TevavidToolsSetup.exe -ArgumentList '--silent','--no-addon','--no-desktop-app' -Wait -PassThru
          Get-Content "$env:USERPROFILE\.tevavid-tools\setup.log" -ErrorAction SilentlyContinue
          if ($setup.ExitCode -ne 0) { throw "setup failed with $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Tevavid Tools"
          & "$app\tevavid-mcp-server.exe" version
          uv run python packaging/smoke_test.py "$app\tevavid-mcp-server.exe"
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Tevavid Tools.lnk")) { throw "no Start menu shortcut" }
          Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TevavidTools" | Select-Object DisplayName, DisplayVersion, UninstallString
          $remove = Start-Process "$app\TevavidTools.exe" -ArgumentList 'uninstall','--quiet' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "uninstall failed with $($remove.ExitCode)" }
          Start-Sleep -Seconds 6
          if (Test-Path "$app\tevavid-mcp-server.exe") { throw "app folder still there after uninstall" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TevavidTools") { throw "uninstall entry still there" }

      - name: Install, check and uninstall (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -x -k dist/release/TevavidToolsSetup-macOS.zip /tmp/setup
          "/tmp/setup/Tevavid Tools Setup.app/Contents/MacOS/TevavidToolsSetup" --selftest || { cat ~/.tevavid-tools/setup.log; exit 1; }
          "/tmp/setup/Tevavid Tools Setup.app/Contents/MacOS/TevavidToolsSetup" --silent --no-addon --no-desktop-app
          server="$HOME/Applications/Tevavid Tools.app/Contents/MacOS/tevavid-mcp-server"
          "$server" version
          uv run python packaging/smoke_test.py "$server"
          "$HOME/Applications/Tevavid Tools.app/Contents/MacOS/TevavidTools" uninstall --quiet
          sleep 5
          test ! -e "$server"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/*

  # A v* tag (made by scripts/release.py) publishes the release: a GitHub release here (this
  # repository can stay private) and the "tevavid.com-downloads" artifact, whose contents go to
  # https://tevavid.com/downloads/ (the version folder, then latest.json, which installed copies
  # check for updates).
  release:
    # Only after the tests passed, and also when a build was cancelled (GitHub sometimes has no
    # macOS machine), never when one failed or was skipped.
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'cancelled') &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release))
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag to publish
        # A pushed v* tag, or for a manual release the version in the code.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"
          else tag="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/archicad_mcp/__init__.py)"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Check the version and write the notes
        run: python scripts/release.py notes "$TAG" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Make the tevavid.com downloads folder
        run: python scripts/make_feed.py "$TAG" release site
      - uses: actions/upload-artifact@v4
        with:
          name: tevavid.com-downloads
          path: site/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Tevavid Tools ${{ env.TAG }}
          body_path: release-notes.md
          files: |
            release/*
            site/latest.json
