<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archicad MCP</title>
<style>
  :root { --font: "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { font: 14px/1.4 var(--font); color: #f3f4f6; background: #1f2328; border: 1px solid #343a42; cursor: default; }
  .head { display: flex; align-items: center; gap: 12px; padding: 14px 10px 0 18px; }
  .head img { width: 30px; height: 30px; border-radius: 7px; }
  .head b { flex: 1; font-weight: 600; font-size: 15px; }
  .x { width: 32px; height: 30px; border: 0; background: none; color: #c9ced4; font-size: 18px; cursor: pointer; border-radius: 6px; }
  .x:hover { background: #2e343b; color: #fff; }
  .body { display: flex; gap: 16px; align-items: center; padding: 10px 18px 0 22px; }
  .ok { width: 30px; height: 30px; border-radius: 50%; background: #22a55a; display: grid; place-content: center; flex: none; }
  .ok::after { content: ""; width: 12px; height: 7px; border: 2.6px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
  .title { font-weight: 600; font-size: 16px; }
  .sub { color: #c9ced4; font-size: 14.5px; }
</style>
</head>
<body onclick="window.pywebview.api.toast_clicked()">
  <div class="head pywebview-drag-region">
    <img src="../../assets/logo-128.png" alt="">
    <b>Archicad MCP</b>
    <button class="x" title="Close" onclick="event.stopPropagation(); window.pywebview.api.close_toast()">&#x2715;</button>
  </div>
  <div class="body">
    <div class="ok"></div>
    <div><div class="title">Installation Complete</div><div class="sub">Archicad MCP is ready to use.</div></div>
  </div>
</body>
</html>
