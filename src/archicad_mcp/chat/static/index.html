<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archicad MCP</title>
<link rel="icon" href="/assets/logo-128.png">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f8fa;
    --card: #ffffff;
    --text: #111827;
    --text-2: #374151;
    --muted: #6b7280;
    --faint: #9ca3af;
    --border: #e5e7eb;
    --border-strong: #d9dde3;
    --accent: #16a34a;
    --accent-strong: #15803d;
    --accent-soft: #eaf7ef;
    --user-bg: #16a34a;
    --user-text: #ffffff;
    --bad: #dc2626;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05);
    --menu-shadow: 0 8px 24px rgba(16, 24, 40, .14);
    --font: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17191c;
      --surface: #1e2125;
      --card: #202328;
      --text: #f3f4f6;
      --text-2: #d1d5db;
      --muted: #9ca3af;
      --faint: #6b7280;
      --border: #2e3238;
      --border-strong: #3a3f46;
      --accent: #22c55e;
      --accent-strong: #4ade80;
      --accent-soft: #1b3326;
      --user-bg: #15803d;
      --bad: #f87171;
      --menu-shadow: 0 8px 24px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  [hidden] { display: none !important; }

  /* --- full panel (screen 7) --------------------------------------------- */
  #full { height: 100%; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; padding: 18px 18px 0; }
  .brand img { width: 56px; height: 56px; border-radius: 12px; flex: none; }
  .brand .name { flex: 1; min-width: 0; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 1px 0 0; color: var(--muted); font-size: 13px; }
  .icon-button { width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); }
  .icon-button:hover { background: var(--surface); }
  .tabs { display: flex; gap: 30px; padding: 14px 22px 0; }
  .tabs button { position: relative; padding: 8px 0 11px; color: var(--muted); font-size: 16px; }
  .tabs button:hover { color: var(--text-2); }
  .tabs button.active { color: var(--accent); font-weight: 600; }
  .tabs button.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px; background: var(--accent); }
  main { flex: 1; min-height: 0; position: relative; }
  .tab { position: absolute; inset: 0; overflow-y: auto; padding: 12px 18px 18px; }

  .notice { margin: 4px 0 10px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
  .notice.bad { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .notice button { text-decoration: underline; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .notice { background: #3a2a14; color: #fcd9a8; border-color: #5c4120; }
    :root:not([data-theme="light"]) .notice.bad { background: #3a1919; color: #fecaca; border-color: #5c2626; }
  }

  .ask-card { border: 1px solid var(--border); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
  .ask { display: flex; align-items: flex-start; gap: 8px; padding: 13px 12px 13px 14px; }
  .ask-card.with-chips .ask { border-bottom: 1px solid var(--border); }
  .ask textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--text); font: 15px/1.4 var(--font); padding: 2px 0; max-height: 140px; min-height: 22px; }
  .ask textarea::placeholder { color: var(--faint); }
  .ask .icon-button { width: 28px; height: 28px; color: var(--accent); margin-top: -2px; }
  .ask .icon-button.listening { background: var(--accent-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 12px 16px; }
  .chips button { border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 14px; color: var(--text-2); font-size: 15px; background: var(--card); }
  .chips button:hover { border-color: var(--accent); color: var(--accent-strong); }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 10px; }
  .section-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .link { color: var(--accent); font-weight: 600; font-size: 15px; }
  .link:hover { text-decoration: underline; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-radius: 10px; cursor: pointer; }
  .row:hover .row-title { color: var(--accent-strong); }
  .tile { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center; color: var(--text-2); flex: none; }
  .tile svg.i { width: 22px; height: 22px; }
  .row-text { flex: 1; min-width: 0; }
  .row-title { font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .icon-button { width: 30px; height: 30px; }
  .empty-hint { color: var(--muted); font-size: 13px; padding: 4px 0; }

  /* conversation */
  #conversation { display: flex; flex-direction: column; padding-bottom: 0; }
  .conv-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .conv-head .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px; }
  .msg { max-width: 92%; padding: 8px 12px; border-radius: 12px; word-wrap: break-word; font-size: 14px; }
  .msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); white-space: pre-wrap; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 4px; }
  .msg.assistant p { margin: 0 0 6px; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant ul, .msg.assistant ol { margin: 4px 0 6px; padding-left: 20px; }
  .msg.error { align-self: stretch; color: var(--bad); border: 1px dashed var(--bad); background: transparent; }
  code { background: var(--border); padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  details.step { align-self: flex-start; max-width: 92%; font-size: 12.5px; color: var(--muted); }
  details.step summary { cursor: pointer; list-style: none; display: flex; gap: 7px; align-items: center; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); }
  details.step summary::-webkit-details-marker { display: none; }
  details.step pre { white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; padding: 8px; border-radius: 7px; background: var(--surface); color: var(--text-2); font-size: 11.5px; max-height: 220px; overflow: auto; }
  .state { width: 14px; display: inline-flex; justify-content: center; }
  .state.ok { color: var(--accent); }
  .state.bad { color: var(--bad); }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--faint); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  img.view { align-self: flex-start; max-width: 92%; border-radius: 10px; border: 1px solid var(--border); }
  .thinking { align-self: flex-start; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; padding: 2px 4px; }
  .composer { background: var(--bg); padding: 8px 0 14px; }

  /* lists in Tools / Library */
  .search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; color: var(--muted); background: var(--card); }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text); font: 14px var(--font); }
  .segmented { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .segmented button { border: 1px solid var(--border-strong); border-radius: 16px; padding: 4px 12px; font-size: 13px; color: var(--text-2); }
  .segmented button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .small-button { border: 1px solid var(--border-strong); border-radius: 7px; padding: 4px 10px; font-size: 13px; color: var(--text-2); flex: none; }
  .small-button:hover { border-color: var(--accent); color: var(--accent-strong); }

  /* settings */
  .field { display: flex; flex-direction: column; gap: 5px; margin: 12px 0; font-size: 13px; color: var(--muted); }
  .field input, .field select { font: 14px var(--font); color: var(--text); background: var(--card); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; outline: none; }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; font-size: 14px; color: var(--text); cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 1px 0 0; }
  .primary { background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 18px; font-weight: 600; }
  .primary:hover { background: var(--accent-strong); }
  .about { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  .saved { color: var(--accent); font-size: 13px; margin-left: 10px; }
  a { color: var(--accent); }

  /* menus */
  .menu { position: fixed; z-index: 10; min-width: 190px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--menu-shadow); padding: 5px; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; font-size: 14px; text-align: left; }
  .menu button:hover { background: var(--surface); }
  .menu button.danger { color: var(--bad); }
  .menu svg.i { width: 17px; height: 17px; color: var(--muted); }

  /* --- compact panel (screen 8) ----------------------------------------- */
  #compact { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 0; }
  #compact img { width: 58px; height: 58px; border-radius: 12px; margin-bottom: 18px; cursor: pointer; }
  #compact .nav { width: 64px; height: 64px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--text-2); }
  #compact .nav svg.i { width: 24px; height: 24px; }
  #compact .nav:hover { background: var(--surface); }
  #compact .nav.active { background: var(--accent-soft); color: var(--accent); }
</style>
</head>
<body>

<div id="full">
  <header class="brand">
    <img src="/assets/logo-128.png" alt="">
    <div class="name">
      <h1>Archicad MCP</h1>
      <p>AI Assistant for Archicad</p>
    </div>
    <button class="icon-button" id="gear" title="Settings"><i data-icon="gear"></i></button>
    <button class="icon-button" id="kebab" title="More"><i data-icon="kebab"></i></button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="chat" class="active">Chat</button>
    <button data-tab="tools">Tools</button>
    <button data-tab="library">Library</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <main>
    <!-- Chat: home -->
    <section class="tab" id="home">
      <div id="homeNotice"></div>
      <div class="ask-card with-chips">
        <form class="ask" id="homeAsk">
          <textarea rows="1" placeholder="Ask anything about your project..."></textarea>
          <button type="button" class="icon-button mic" title="Voice input"><i data-icon="mic"></i></button>
          <button type="submit" class="icon-button send" title="Send" hidden><i data-icon="send"></i></button>
        </form>
        <div class="chips" id="chips">
          <button type="button">Create a wall</button>
          <button type="button">Generate a section</button>
          <button type="button">Make a schedule</button>
          <button type="button">Optimize for daylight</button>
        </div>
      </div>
      <div class="section-head">
        <h2>Recent</h2>
        <button class="link" id="seeAll">See all</button>
      </div>
      <div id="recent"></div>
    </section>

    <!-- Chat: all conversations -->
    <section class="tab" id="allChats" hidden>
      <div class="conv-head">
        <button class="icon-button" data-back title="Back"><i data-icon="back"></i></button>
        <div class="title">All conversations</div>
        <button class="small-button" data-new>New chat</button>
      </div>
      <div id="allList"></div>
    </section>

    <!-- Chat: one conversation -->
    <section class="tab" id="conversation" hidden>
      <div class="conv-head">
        <button class="icon-button" data-back title="Back to Recent"><i data-icon="back"></i></button>
        <div class="title" id="convTitle">New chat</div>
        <button class="small-button" data-new>New chat</button>
      </div>
      <div id="log"></div>
      <div class="composer">
        <div class="ask-card">
          <form class="ask" id="convAsk">
            <textarea rows="1" placeholder="Ask a follow-up..."></textarea>
            <button type="button" class="icon-button mic" title="Voice input"><i data-icon="mic"></i></button>
            <button type="submit" class="icon-button send" title="Send"><i data-icon="send"></i></button>
          </form>
        </div>
      </div>
    </section>

    <!-- Tools -->
    <section class="tab" id="tools" hidden>
      <div id="toolList"></div>
      <div class="section-head"><h2>Archicad commands</h2></div>
      <label class="search"><i data-icon="search"></i><input id="commandSearch" placeholder="Search 400+ commands: layer, dimension, IFC..."></label>
      <div id="commandList"></div>
    </section>

    <!-- Library -->
    <section class="tab" id="library" hidden>
      <label class="search"><i data-icon="search"></i><input id="librarySearch" placeholder="Search library parts"></label>
      <div class="segmented" id="libraryTypes">
        <button data-type="Object" class="active">Objects</button>
        <button data-type="Door">Doors</button>
        <button data-type="Window">Windows</button>
        <button data-type="Lamp">Lamps</button>
      </div>
      <div id="libraryList"></div>
    </section>

    <!-- Settings -->
    <section class="tab" id="settings" hidden>
      <div class="field">Anthropic API key
        <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-...">
      </div>
      <div class="empty-hint">Archicad MCP talks to Claude with your own key, stored only on this computer.
        Create one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</div>
      <div class="field">Model <select id="model"></select></div>
      <div class="field">Effort (higher is more careful, slower and costs more) <select id="effort"></select></div>
      <label class="check"><input type="checkbox" id="autoOpen"> <span>Open this panel when Archicad starts</span></label>
      <button class="primary" id="saveSettings">Save</button><span class="saved" id="savedNote" hidden>Saved</span>
      <div class="about" id="about"></div>
    </section>
  </main>
</div>

<div id="compact" hidden>
  <img src="/assets/logo-128.png" alt="Archicad MCP" title="Expand" data-expand="chat">
  <button class="nav active" data-expand="chat" title="Chat"><i data-icon="chat"></i></button>
  <button class="nav" data-expand="tools" title="Tools"><i data-icon="grid"></i></button>
  <button class="nav" data-expand="library" title="Library"><i data-icon="cube"></i></button>
  <button class="nav" data-expand="settings" title="Settings"><i data-icon="gear"></i></button>
</div>

function api(path, body) {
  return fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json", "X-Archicad-MCP-Token": token },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
}
const getJson = async path => (await api(path)).json();
const postJson = async (path, body = {}) => (await api(path, body)).json();

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// A small, safe Markdown subset: paragraphs, lists, headings, bold, italics and inline code.
function renderMarkdown(text) {
  const inline = s => escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  const out = [];
  let list = null;
  for (const line of text.split("\n")) {
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const item = bullet || numbered;
    if (item) {
      const tag = bullet ? "ul" : "ol";
      if (list !== tag) { if (list) out.push(`</${list}>`); list = tag; out.push(`<${tag}>`); }
      out.push(`<li>${inline(item[1])}</li>`);
      continue;
    }
    if (list) { out.push(`</${list}>`); list = null; }
    const heading = line.match(/^#+\s+(.*)$/);
    if (heading) out.push(`<p><strong>${inline(heading[1])}</strong></p>`);
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join("");
}

function timeAgo(seconds, now) {
  const s = Math.max(0, now - seconds);
  if (s < 60) return "just now";
  for (const [name, size] of [["day", 86400], ["hour", 3600], ["min", 60]]) {
    if (s >= size) {
      const n = Math.floor(s / size);
      return `${n} ${name}${n === 1 ? "" : "s"} ago`;
    }
  }
}

const STEP_LABELS = {
  archicad_status: "Checking Archicad", list_archicad_instances: "Finding Archicad", select_archicad_instance: "Switching Archicad",
  get_stories: "Reading stories", get_elements: "Finding elements", get_selected_elements: "Reading the selection",
  get_element_details: "Reading element details", find_properties: "Looking up properties",
  get_element_properties: "Reading properties", get_element_quantities: "Calculating quantities",
  get_view_image: "Looking at the view", create_walls: "Creating walls", create_slabs: "Creating slabs",
  create_columns: "Creating columns", create_beams: "Creating beams", create_roofs: "Creating roofs",
  create_windows: "Placing windows", create_doors: "Placing doors", create_zones: "Creating zones",
  create_objects: "Placing objects", move_elements: "Moving elements", rotate_elements: "Rotating elements",
  delete_elements: "Deleting elements", set_element_properties: "Setting properties", select_elements: "Selecting elements",
  highlight_elements: "Highlighting elements", save_project: "Saving the project",
  search_tapir_commands: "Searching commands", get_tapir_command_schema: "Reading a command",
  run_tapir_command: "Running", run_archicad_command: "Running",
};

function addStep(item) {
  const details = document.createElement("details");
  details.className = "step";
  const command = item.input && (item.input.command_name || item.input.command);
  const label = (STEP_LABELS[item.name] || item.name) + (command ? ` ${command}` : "");
  details.innerHTML = '<summary><span class="state"><span class="spin"></span></span><span class="label"></span></summary><pre></pre>';
  details.querySelector(".label").textContent = label;
  details.querySelector("pre").textContent = "Input: " + JSON.stringify(item.input, null, 1);
  log.appendChild(details);
  if ("ok" in item) finishStep(details, item);
  scrollDown();
  return details;
}

function finishStep(details, item) {
  const state = details.querySelector(".state");
  state.className = `state ${item.ok ? "ok" : "bad"}`;
  state.textContent = item.ok ? "✓" : "!";
  details.querySelector("pre").textContent += "\n\nResult: " + item.summary;
}

function renderItems(items) {
  log.innerHTML = "";
  for (const item of items) {
    if (item.type === "user") addMessage("user", item.text);
    else if (item.type === "assistant") addMessage("assistant", item.text);
    else if (item.type === "tool") addStep(item);
    else if (item.type === "image") addImage(item);
    else if (item.type === "error") addMessage("error", item.text);
  }
}

function setBusy(value) {
  busy = value;
  const sendButton = $("convAsk").querySelector(".send");

async function send(text) {
  if (!hasKey) { setTab("settings"); $("apiKey").focus(); return; }
  if (busy) return;
  setTab("chat");
  if (chatView !== "conversation") setChatView("conversation");
  if ($("convTitle").textContent === "New chat") $("convTitle").textContent = text.length > 52 ? text.slice(0, 50) + "..." : text;
  addMessage("user", text);
  setBusy(true);
  showThinking(true);
  let assistant = null, assistantText = "";
  const steps = {};
  try {
    const response = await api("/api/chat", { message: text });
    if (!response.ok) throw new Error((await response.json()).error || `server answered ${response.status}`);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let newline;
      while ((newline = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, newline);
        buffer = buffer.slice(newline + 1);
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        if (event.type === "done") continue;
        showThinking(false);
        if (event.type === "text") {
          if (!assistant) { assistant = addMessage("assistant", ""); assistantText = ""; }
          assistantText += event.text;
          assistant.innerHTML = renderMarkdown(assistantText);
          scrollDown();
        } else if (event.type === "tool_start") {
          assistant = null;
          steps[event.id] = addStep(event);
        } else if (event.type === "tool_end") {
          if (steps[event.id]) finishStep(steps[event.id], event);
          showThinking(true);
        } else if (event.type === "image") {
          addImage(event);
        } else if (event.type === "error") {
          addMessage("error", event.message);
        } else if (event.type === "stopped") {
          addMessage("error", "Stopped.");
        }
      }
    }
  } catch (error) {
    addMessage("error", `Lost the connection to Archicad MCP: ${error.message}`);
  } finally {
    showThinking(false);
    setBusy(false);
  }
}

/* ---- ask boxes, chips and voice input ---------------------------------- */

function wireAsk(form) {
  const textarea = form.querySelector("textarea");
  const sendButton = form.querySelector(".send");
  const grow = () => {
    textarea.style.height = "";
    textarea.style.height = textarea.scrollHeight + "px";
    if (form.id === "homeAsk") sendButton.hidden = !textarea.value.trim();
  };
  textarea.addEventListener("input", grow);
  textarea.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); }
  });
  form.onsubmit = event => {
    event.preventDefault();
    if (busy) { postJson("/api/stop"); return; }
    const text = textarea.value.trim();
    if (!text) return;
    textarea.value = "";
    grow();
    send(text);
  };
  form.querySelector(".mic").onclick = () => dictate(textarea, form.querySelector(".mic"), grow);
}
wireAsk($("homeAsk"));
wireAsk($("convAsk"));
$("chips").onclick = event => { const b = event.target.closest("button"); if (b) send(b.textContent); };

function dictate(textarea, button, after) {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    textarea.focus();
    alert(navigator.userAgent.includes("Windows")
      ? "Voice input: press Windows key + H to dictate into the text box."
      : "Voice input: press the Fn (Globe) key twice to dictate into the text box.");
    return;
  }
  const recognition = new Recognition();
  recognition.interimResults = false;
  recognition.lang = navigator.language || "en-US";
  button.classList.add("listening");
  recognition.onresult = event => {
    const spoken = Array.from(event.results).map(r => r[0].transcript).join(" ");
    textarea.value = (textarea.value ? textarea.value + " " : "") + spoken;
    after();
    textarea.focus();
  };
  recognition.onend = recognition.onerror = () => button.classList.remove("listening");
  recognition.start();
}

async function refreshStatus() {
  let status;
  try {
    status = await getJson("/api/status");
  } catch (error) {
    $("homeNotice").innerHTML = '<div class="notice bad">The Archicad MCP service stopped. Open Archicad MCP again.</div>';
    return;
  }
  hasKey = status.settings.hasKey;
  const model = $("model"), effort = $("effort");
  if (!model.options.length) {
    for (const [id, name] of Object.entries(status.models)) model.add(new Option(name, id));
    for (const level of status.efforts) effort.add(new Option(level, level));
  }
  model.value = status.settings.model;
  effort.value = status.settings.effort;
  $("autoOpen").checked = status.settings.autoOpenPanel;
  $("apiKey").placeholder = status.settings.hasKey
    ? (status.settings.keyFromEnvironment ? "Using ANTHROPIC_API_KEY" : "Saved. Paste a new key to replace it")
    : "sk-ant-...";

  const a = status.archicad;
  let notice = "";
  if (!hasKey) notice = '<div class="notice">Add your Anthropic API key to start. <button data-go="settings">Open Settings</button></div>';
  else if (!a.connected) notice = '<div class="notice bad">Archicad is not running. Start Archicad and open a project.</div>';
  else if (!a.tapir) notice = '<div class="notice">The Tapir add-on is not loaded, so the assistant can read but not change the model. Run the Archicad MCP installer again.</div>';
  $("homeNotice").innerHTML = notice;
  $("homeNotice").querySelector("[data-go]")?.addEventListener("click", () => setTab("settings"));

  $("about").innerHTML = a.connected
    ? `Connected to Archicad ${escapeHtml(a.product.version)} (build ${escapeHtml(a.product.buildNumber)}) on port ${escapeHtml(a.port)}<br>` +
      `Project: ${escapeHtml(a.project || "untitled")}<br>Tapir add-on: ${a.tapir ? escapeHtml(a.tapirVersion || "installed") : "not loaded"}`
    : `Archicad: not connected<br>${escapeHtml(a.message || "")}`;
}

  const history = await loadHistory();
  if (history.items.length) chatView = "conversation";
  const tab = ["chat", "tools", "library", "settings"].includes(params.get("tab")) ? params.get("tab") : "chat";
  setTab(hasKey ? tab : "settings");
  if (chatView === "home") loadRecent();
  if (history.busy) setBusy(true);
  setInterval(() => { if (!busy) refreshStatus(); }, 20000);
})();
</script>
</body>
</html>
